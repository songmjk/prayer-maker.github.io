<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 기도문 만들기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f7f5ef;
      color: #333;
      font-family: "Malgun Gothic", sans-serif;
      line-height: 1.7;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      color: #526b55;
      margin-bottom: 8px;
    }

    .intro {
      color: #666;
    }

    .panel {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 3px 12px #00000008;
    }

    label, h2 {
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    .section-title {
      color: #526b55;
      margin-top: 0;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      width: 100%;
      padding: 13px;
      text-align: left;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.6;
      cursor: pointer;
    }

    .option:hover {
      background: #f4f7f1;
    }

    .option.selected {
      background: #e6efe3;
      border: 2px solid #698568;
      font-weight: bold;
    }

    .prayer {
      min-height: 150px;
      padding: 20px;
      background: #faf9f5;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 17px;
    }

    .hint {
      color: #777;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .action {
      padding: 12px 18px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: #526b55;
      color: white;
    }

    .secondary {
      background: #eae8e0;
      color: #333;
    }

    @media (max-width: 500px) {
      body {
        padding: 16px 10px;
      }

      .panel {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>🙏 나만의 기도문 만들기</h1>
      <p class="intro">
        마음에 드는 문장을 하나씩 골라 나만의 기도를 완성해 보세요.
      </p>
    </header>

    <section class="panel">
      <label for="season">① 기도 주제를 선택하세요.</label>

      <select id="season">
        <option value="주일">평소 주일 기도</option>
        <option value="창조절">창조절 기도</option>
        <option value="감사절">감사절 기도</option>
        <option value="대림절">대림절 기도</option>
        <option value="주현절">주현절 기도</option>
        <option value="사순절">사순절 기도</option>
        <option value="부활절">부활절 기도</option>
        <option value="성령강림절">성령강림절 기도</option>        
      </select>
    </section>

    <div id="questions"></div>

    <section class="panel">
      <h2 class="section-title">💚 완성된 나의 기도문</h2>

      <p class="hint">
        선택한 문장이 아래에 순서대로 모입니다.
      </p>

      <div id="prayer" class="prayer" aria-live="polite">
        마음에 드는 문장을 선택해 보세요.
      </div>

      <div class="actions">
        <button class="action primary" id="copy">
          기도문 복사하기
        </button>

        <button class="action secondary" id="reset">
          처음부터 다시 하기
        </button>
      </div>

      <p id="message" class="hint" aria-live="polite"></p>
    </section>

  </main>

    const ending = "우리를 사랑하시는 예수님의 이름으로 기도드립니다. 아멘.";

    const selected = {};

    const seasonSelect = document.getElementById("season");
    const questions = document.getElementById("questions");
    const prayer = document.getElementById("prayer");
    const message = document.getElementById("message");

    // 선택한 절기에 맞는 문장 버튼 만들기
    function renderQuestions() {
      const season = seasonSelect.value;
      questions.replaceChildren();

      for (const [category, sentences] of Object.entries(prayerData[season])) {
        const panel = document.createElement("section");
        panel.className = "panel";

        const title = document.createElement("h2");
        title.className = "section-title";
        title.textContent = category;

        const options = document.createElement("div");
        options.className = "options";

        sentences.forEach((sentence, index) => {
          const button = document.createElement("button");
          button.className = "option";
          button.textContent = `${index + 1}. ${sentence}`;
          button.type = "button";

          const isSelected = selected[category] === sentence;

          if (isSelected) {
            button.classList.add("selected");
            button.setAttribute("aria-pressed", "true");
          } else {
            button.setAttribute("aria-pressed", "false");
          }

          button.addEventListener("click", () => {
            selected[category] = sentence;
            message.textContent = "";
            renderQuestions();
            renderPrayer();
          });

          options.appendChild(button);
        });

        panel.append(title, options);
        questions.appendChild(panel);
      }
    }

    // 선택한 문장을 순서대로 연결하기
    function renderPrayer() {
      const categories = Object.keys(prayerData[seasonSelect.value]);

      const sentences = categories
        .filter(category => selected[category])
        .map(category => selected[category]);

      if (sentences.length === 0) {
        prayer.textContent = "마음에 드는 문장을 선택해 보세요.";
        return;
      }

      const text = sentences.join(",\n\n");
      const allSelected = categories.every(
        category => selected[category]
      );

      prayer.textContent = allSelected
        ? text + "\n\n" + ending
        : text + "\n\n(나머지 문장도 선택해 보세요.)";
    }

    // 절기를 바꾸면 기존 선택을 초기화
    seasonSelect.addEventListener("change", () => {
      Object.keys(selected).forEach(key => delete selected[key]);
      message.textContent = "";
      renderQuestions();
      renderPrayer();
    });

    // 기도문 복사하기
    document.getElementById("copy").addEventListener("click", async () => {
      try {
        const categories = Object.keys(prayerData[seasonSelect.value]);
        const allSelected = categories.every(
          category => selected[category]
        );

        if (!allSelected) {
          message.textContent = "먼저 모든 영역의 문장을 선택해 주세요.";
          return;
        }

        await navigator.clipboard.writeText(
          prayer.textContent.replace(/\n\n\(나머지 문장도 선택해 보세요\.\)/, "")
        );

        message.textContent = "기도문을 복사했어요!";
      } catch {
        message.textContent =
          "복사할 수 없어요. 기도문을 직접 선택해서 복사해 주세요.";
      }
    });

    // 처음부터 다시 하기
    document.getElementById("reset").addEventListener("click", () => {
      Object.keys(selected).forEach(key => delete selected[key]);
      message.textContent = "";
      renderQuestions();
      renderPrayer();
    });

    renderQuestions();
    renderPrayer();
  </script>
